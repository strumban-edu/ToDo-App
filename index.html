<!DOCTYPE html>

<html>
    <head>
        <meta charset = "UTF-8">
        <link rel = "stylesheet" href = "mystyle.css">

        <title>To-Do List Demo</title> 
    </head>

    <body>
        <div class = "menu_bar">
        <div>
            <button type = "button">Calendar</button>
            <button type = "button">Journal</button>
            <button type = "button" class = "add_task">Add Task</button>
            <button type = "button" class = "account">Account</button>
        </div>
        </div>

        <div class = "boxes">
        <div class = "current_box">
            <div class = "todo_box">
                <h2>Today</h2>
                
                <label>
                    <input type="checkbox">
                    Task 1
                </label>

                <h3>Task 2</h3>
                <h3>Task 3</h3>
                <h3>Task 4</h3>
                <h3>Task 5</h3>
                <h3>Task 6</h3>
                <h3>Task 7</h3>
                <h3>Task 8</h3>
                <h3>Task 9</h3>
                <h3>Task 10</h3>
                <h3>Task 11</h3>
                <h3>Task 12</h3>
            </div>
        </div>

        <div class = "mini_box_1">
            <div class = "todo_box">
                <h2>7 day</h2>
                <label>
                    <input type="checkbox">
                    Task 1
                </label>
                <h3>Task 2</h3>
                <h3>Task 3</h3>
                <h3>Task 4</h3>
                <h3>Task 5</h3>
            </div>
        </div>

        <div class = "mini_box_2">
            <div class = "todo_box">
                <h2>30 day</h2>
                <label>
                    <input type="checkbox">
                    Task 1
                </label>
                <h3>Task 2</h3>
                <h3>Task 3</h3>
                <h3>Task 4</h3>
                <h3>Task 5</h3>
            </div>
        </div>

        <div class = "goals_box">
            <div class = "todo_box">
                <h2>Goals</h2>
                <label>
                    <input type="checkbox">
                    Goal 1
                </label>
                <h3>Goal 2</h3>
                <h3>Goal 3</h3>
                <h3>Goal 4</h3>
            </div>
        </div>
        </div>
    </body>
</html>
